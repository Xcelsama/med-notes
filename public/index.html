<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Med Notebook</title>
<meta name="description" content="A school-notebook style app for medical study notes, images and saved AI conversations.">
<meta name="theme-color" content="#f4eee0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var s=JSON.parse(localStorage.getItem('nb-settings')||'{}');var r=document.documentElement;if(s.theme)r.dataset.theme=s.theme;if(s.font)r.dataset.font=s.font;if(s.size)r.dataset.size=s.size;}catch(e){}</script>
</head>
<body>
<div id="app">
  <aside id="binder" aria-label="Binder"></aside>
  <div id="scrim" hidden></div>
  <div id="main">
    <header id="topbar"></header>
    <div id="scroll"><div id="view"></div></div>
    <div id="dock" hidden></div>
  </div>
</div>
<button id="fab" aria-label="New" hidden></button>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<div id="lock" hidden></div>
<script src="merge.js"></script>
<script src="md.js"></script>
<script src="prompts.js"></script>
<script src="app.js"></script>
</body>
</html>
